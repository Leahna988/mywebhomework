<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>01</title>
    <style>

        form{border: 3px outset #fff;
            padding:10px;
            width: 300px;
            font-family: "宋体";
            background: #c0c0c0;
            font-size: small;
        }
        .form-header{
            background-color: #08089f;
            padding: 2px 10px;
            text-align: left;
            font-size: 14px;
            margin: -10px -10px 10px -10px;
        }
        .center form{
           position:absolute;
           top:50%;
           left:50%;
           transform: translate(-50%,-50%);
        }
        body{
            margin: 0;
            background-color: rgb(32, 130, 125);
        }
        .form-header h3 
        {
            margin: 0;
            color: #f4e6e6;
             font-weight: normal;
             font-size: 18px;
             font-size: small;
            font-family:"宋体" ;
        }
        input{
            border: 1.5px outset #5f5e5e;
            font-family:"MS Sans Serif" ;
        }

    </style>
</head>
<body>
    <div class="center">
        <form>
        <div class="form-header">
            <h3>正在连接中...</h3>
        </div>

        <div style="text-align: center;">

        用户：<input type="text"><br><br>
        密码：<input type="tel"><br><br>
        </div>
        <div style="text-align: center;">
        <input type="button" value="OK"
        onclick="location.href='all.html'">
        </div>

    
        
        
    </form>
    </div>
    
</body>
</html>
