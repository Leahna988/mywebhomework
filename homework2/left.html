    .gery-bar {
        
        height: 22px;
        background:  #c0c0c0;
    }
     .gery-bar h3{
        margin:0px ;
        padding: 2px;
        font-family: 'MS Sans Serif';

        color: #f9f6f6;
        font-size: small;
    }
    .p1{
    width: 150px ;
    height: auto;
    padding:10px ;
    border: #08089f;
    
    }
    .personal{
    border: 4px double #b4e8d7;
    gap: 20px;
    justify-self: center;
    width: 200px;
    }
    .t1{
        justify-self: center;
    }

    .slide-box {
     margin:30px ;
     width: 200px;
     height: 200px;
     overflow: hidden;
     justify-self: center;
     }


    .slide-wrap {
     display: flex;
     gap: 15px;      
     animation: run 15s infinite;
     }

    .slide-wrap img {
     width: 200px;
     height: 200px;
     flex-shrink: 0;
  
     }


@keyframes run {
 
  0%    { transform: translateX(0); }
  15%   { transform: translateX(0); }
  30%   { transform: translateX(calc(-200px - 15px)); }
  45%   { transform: translateX(calc(-200px - 15px)); }

  60%   { transform: translateX(calc(-400px - 30px)); }
  75%   { transform: translateX(calc(-400px - 30px)); }

  100%   { transform: translateX(calc(-600px - 45px)); }
  
}

  
</style>
</head>
<body>
     <div class="blue-bar">

      <div class="gery-bar">

         <img src="a01.jpg" alt="">

</body>
