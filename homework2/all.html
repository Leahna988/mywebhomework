<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>X-frame-option</title>
    <style>
        body{
            background-color: rgb(32, 130, 125);
           
        }
         * {
        margin:0;
        padding:0;
        box-sizing:border-box;
         }

        iframe{
            float:none;
          
        } 
     .main-container {
         margin: 0 auto; 
         width: 70%;     
        
        }
      .full {
        width: 70%;
        float: none;
        margin: 0 auto;
        display: block;
        
         }
    
    </style>
</head>
<body>
     <iframe class="full" height="100" src="top.html"></iframe> <!--顶部 -->

    <div class="main-container">
    
    

    <iframe height="700" width="10%" src="content.html"></iframe><!--左部 -->
    <iframe height="700" width="60%" name="abc" src="right.html"></iframe><!--右部 -->
    <iframe height="700" width="29%" src="left.html"></iframe>
    
    </div>
    <iframe class="full" height="100" src="bottom.html"></iframe>
</body>
</html>
