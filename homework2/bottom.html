<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .footer-wrap {
            background: linear-gradient(to bottom, #1E3A8A 0%, #3B82F6 10%, #3B82F6 90%, #1E3A8A 100%);
            color: white;
            padding: 15px;
            font-family: "宋体", sans-serif;
        }
       
        .link-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .link-box a {
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .link-box a:hover {
            color: #ffd700;
        }
        .msg-area {
            text-align: center;
        }
        .msg-area textarea {
            width: 300px;
            height: 60px;
            padding: 8px;
            border: none;
            border-radius: 4px;
            resize: none;
            margin-right: 8px;
        }
        .msg-area button {
            padding: 8px 16px;
            border: none;
            background: #1E3A8A;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
        }
       
    </style>
</head>
<body>
    <div class="footer-wrap">
       
        <div class="link-box">
            <a href=" " target="_blank">📘 Facebook</a >
            <a href="https://twitter.com" target="_blank">🐦 Twitter</a >
            <a href="https://www.weibo.com" target="_blank">📱 微博</a >
            <a href="https://weixin.qq.com" target="_blank">💬 微信</a >
            <a href="mailto:example@mail.com">📧 联系我们</a >
        </div>

     
        <div class="msg-area">
            <textarea placeholder="在此写下你的留言..."></textarea>
            <button>提交留言</button>
        </div>
    </div>
</body>
</html>
